name: ArSonVerb v1.0.1 Native Distribution (Windows, Linux, macOS)

on:
  workflow_dispatch:
  push:
    branches: [release/publish-v1.0.1]

permissions:
  contents: read

concurrency:
  group: arsonverb-native-v1.0.1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} / build, CTest, package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test platform packaging without compiling JUCE
        shell: bash
        run: python tests/test_distribution_packaging.py
      - name: Enforce immutable product/source distribution basis
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'project(arsonverb VERSION 1.0.1 LANGUAGES C CXX)' CMakeLists.txt
          grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' LICENSE
          grep -q 'SIL OPEN FONT LICENSE' assets/fonts/OFL.txt
          test -s packaging/windows/ArSonVerb.iss
          test -s docs/RELEASE_V1.0.1.md
      - name: Linux JUCE 9 build dependencies and headless X display
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends             ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev             libfreetype-dev libfontconfig1-dev             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev             libxinerama-dev libxrandr-dev libxrender-dev libxi-dev             libegl-dev libgl1-mesa-dev
      - name: Configure Windows JUCE VST3 and Standalone
        if: matrix.platform == 'windows'
        shell: pwsh
        run: >
          cmake -S . -B build-distribution -G "Visual Studio 17 2022" -A x64
          -DARVERB_BUILD_PLUGIN=ON -DARVERB_BUILD_TESTS=ON -DARVERB_BUILD_SHARED=ON
      - name: Configure Linux JUCE VST3 and Standalone
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cmake -S . -B build-distribution -G Ninja -DCMAKE_BUILD_TYPE=Release             -DARVERB_BUILD_PLUGIN=ON -DARVERB_BUILD_TESTS=ON -DARVERB_BUILD_SHARED=ON
      - name: Configure Universal macOS JUCE VST3 and Standalone
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cmake -S . -B build-distribution -G Ninja -DCMAKE_BUILD_TYPE=Release             "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"             -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0             -DARVERB_BUILD_PLUGIN=ON -DARVERB_BUILD_TESTS=ON -DARVERB_BUILD_SHARED=ON
      - name: Compile actual JUCE plugin and full native host tests
        shell: bash
        run: |
          cmake --build build-distribution --config Release --parallel 2             --target ARStudioReverb_VST3 ARStudioReverb_Standalone               arverb_plugin_host_tests arverb_tests arverb_contract_tests               arverb_audio_regression_tests arverb_stress_tests               arverb_c_abi_tests arverb_audio_signature               arverb_sonic_structure_tests arverb_algorithm_tests               arverb_mix_air_tests arverb_rt60_tail_tests               arverb_preset_transition_tests
      - name: Full CTest gate (Linux Xvfb)
        if: matrix.platform == 'linux'
        shell: bash
        run: xvfb-run --auto-servernum ctest --test-dir build-distribution -C Release --output-on-failure
      - name: Full CTest gate (Windows and macOS)
        if: matrix.platform != 'linux'
        shell: bash
        run: ctest --test-dir build-distribution -C Release --output-on-failure
      - name: Verify macOS binary architecture slices
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          vst3="$(find build-distribution/ARStudioReverb_artefacts -type d -name ArSonVerb.vst3 -print -quit)"
          app="$(find build-distribution/ARStudioReverb_artefacts -type d -name ArSonVerb.app -print -quit)"
          test -n "$vst3" && test -n "$app"
          # lipo -verify_arch expects a single architecture per query.
          # Query the actual fat binary once and explicitly require both
          # independent slices; failure is a hard release blocker.
          for binary in "$vst3/Contents/MacOS/ArSonVerb" "$app/Contents/MacOS/ArSonVerb"; do
            archs="$(lipo -archs "$binary")"
            echo "$binary architectures: $archs"
            [[ " $archs " == *" arm64 "* ]]
            [[ " $archs " == *" x86_64 "* ]]
          done
          # Ad-hoc code signature is for Mach-O load integrity only.
          # It is NOT Apple Developer ID signing or notarization.
          codesign --force --deep --sign - "$vst3"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep "$vst3"
          codesign --verify --deep "$app"
      - name: Package independently downloadable VST3 and Standalone
        shell: bash
        run: |
          python scripts/package_distribution.py --platform "${{ matrix.platform }}"             --build build-distribution --out release-assets
      - name: Install free Inno Setup 6
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile per-user selectable VST3 / Standalone installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Resolve only known paths; recursively scanning all Program Files
          # wastes runner minutes on every release.
          $locations = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\ProgramData\chocolatey\bin\ISCC.exe'
          )
          $compiler = $locations | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $compiler = $command.Source }
          }
          if (-not $compiler) { throw 'Inno Setup ISCC.exe not found after install' }
          & $compiler 'packaging/windows/ArSonVerb.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler failed' }
          $setup = 'release-assets/ArSonVerb-Windows-x64-Setup-v1.0.1.exe'
          if (!(Test-Path $setup)) { throw 'Installer not created' }
          python scripts/package_distribution.py --platform windows --out release-assets --checksums-only
      - name: Upload validated OS-native distribution files
        uses: actions/upload-artifact@v4
        with:
          name: arsonverb-v1.0.1-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Audit 3 operating systems and publish immutable GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/publish-v1.0.1'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refuse stale build or existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | cut -f1)"
          test -n "$current_main"
          test "$current_main" = "$GITHUB_SHA"
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.1 already published: no replacement of immutable assets' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: arsonverb-v1.0.1-*
          path: release-assets
          merge-multiple: true
      - name: Verify all seven binaries and all platform checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s ArSonVerb-Windows-x64-VST3-v1.0.1.zip
          test -s ArSonVerb-Windows-x64-Standalone-v1.0.1.zip
          test -s ArSonVerb-Windows-x64-Setup-v1.0.1.exe
          test -s ArSonVerb-Linux-x86_64-VST3-v1.0.1.tar.gz
          test -s ArSonVerb-Linux-x86_64-Standalone-v1.0.1.tar.gz
          test -s ArSonVerb-macOS-universal-VST3-v1.0.1.zip
          test -s ArSonVerb-macOS-universal-Standalone-v1.0.1.zip
          for platform in windows linux macos; do
            test -s "SHA256SUMS-$platform.txt"
          done
          cat SHA256SUMS-windows.txt SHA256SUMS-linux.txt SHA256SUMS-macos.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          # Validate the actual user download files, not just nonzero size.
          unzip -t ArSonVerb-Windows-x64-VST3-v1.0.1.zip
          unzip -t ArSonVerb-macOS-universal-VST3-v1.0.1.zip
          # With pipefail, grep -q can close stdout early and send tar SIGPIPE.
          # Materialize the listing, then verify without a broken pipeline.
          tar -tzf ArSonVerb-Linux-x86_64-VST3-v1.0.1.tar.gz > linux-vst3-entries.txt
          grep -q 'ArSonVerb.vst3/' linux-vst3-entries.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 7
      - name: Publish public v1.0.1 with seven distinct choices
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.1 release-assets/ArSonVerb-* release-assets/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title 'ArSonVerb v1.0.1 — Windows, Linux & macOS'             --notes-file docs/RELEASE_V1.0.1.md --latest
