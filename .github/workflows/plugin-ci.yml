name: JUCE VST3 Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/**'
      - 'plugins/**'
      - 'CMakeLists.txt'
      - '.github/workflows/plugin-ci.yml'
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'src/**'
      - 'plugins/**'
      - 'CMakeLists.txt'
      - '.github/workflows/plugin-ci.yml'

permissions:
  contents: read

concurrency:
  group: arverb-juce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure JUCE 9.0.4 and AR Studio Reverb
        run: >-
          cmake -S . -B build-plugin
          -G "Visual Studio 17 2022" -A x64
          -DARVERB_BUILD_PLUGIN=ON
          -DARVERB_BUILD_TESTS=ON
          -DARVERB_BUILD_SHARED=ON
      - name: Build VST3, Standalone, and host smoke tests
        run: cmake --build build-plugin --config Release --parallel 2 --target ARStudioReverb_VST3 ARStudioReverb_Standalone arverb_plugin_host_tests arverb_tests arverb_contract_tests arverb_audio_regression_tests arverb_stress_tests arverb_c_abi_tests arverb_audio_signature
      - name: Run DSP and real AudioProcessor host-contract tests
        run: ctest --test-dir build-plugin -C Release --output-on-failure
        env:
          # GUI paint measurements execute only in the host test's GUI thread.
          ARVERB_GUI_PROFILE_CSV: p1-gui-profile.csv
      - name: Upload unsigned test artifact (not a validated release)
        uses: actions/upload-artifact@v4
        with:
          name: ARStudioReverb-Windows-x64-unsigned
          path: |
            build-plugin/ARStudioReverb_artefacts/Release/VST3/**
            build-plugin/ARStudioReverb_artefacts/Release/Standalone/**
            build-plugin/p1-gui-profile.csv
          if-no-files-found: error
          retention-days: 7
