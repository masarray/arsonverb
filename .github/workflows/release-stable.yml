name: Public Stable Release (AGPL-3.0 / physical QA gate)

on:
  # One-shot publication branch: the owner approved public stable on 2026-11-01.
  # It is created from the tested main HEAD; on this exact branch the build
  # and full CTest gate run before GitHub Release is published.
  push:
    branches: [release/publish-v1.0.0]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable tag must match CMake product version"
        required: true
        default: "v1.0.0"
        type: string
      juce_rights_confirmed:
        description: "I confirm the applicable JUCE licence is valid for distribution"
        required: true
        type: boolean
        default: false
      project_rights_confirmed:
        description: "I own/have permission to distribute this source, code, fonts and images"
        required: true
        type: boolean
        default: false
      device_qa_confirmed:
        description: "I physically verified this version with a real audio interface/DAW"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arsonverb-public-stable-release
  cancel-in-progress: false

jobs:
  release-windows:
    name: Audit, build, validate and publish stable Windows package
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/release/publish-v1.0.0')
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce explicit legal and physical sign-off
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            test "${{ inputs.juce_rights_confirmed }}" = "true"
            test "${{ inputs.project_rights_confirmed }}" = "true"
            test "${{ inputs.device_qa_confirmed }}" = "true"
          else
            # The owner authorised stable release after testing P9, in chat.
            # The only automatic trigger is this immutable named branch.
            test "${{ github.event_name }}" = "push"
            test "${{ github.ref }}" = "refs/heads/release/publish-v1.0.0"
            # Source to be tagged must be exactly the current main commit.
            # Fail closed rather than publishing stale/unreviewed branch code.
            main_sha="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | cut -f1)"
            test -n "$main_sha"
            test "$main_sha" = "${{ github.sha }}"
          fi
          test "${{ inputs.version }}" = "v1.0.0"
          grep -q 'project(arsonverb VERSION 1.0.0 LANGUAGES C CXX)' CMakeLists.txt
          test -s LICENSE
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          test -s assets/fonts/OFL.txt
          grep -q "SIL OPEN FONT LICENSE" assets/fonts/OFL.txt
          echo "Explicit rights / physical acceptance gates provided; these are owner declarations."
      - name: Compile JUCE 9.0.4 Windows VST3 and Standalone
        run: >-
          cmake -S . -B build-public
          -G "Visual Studio 17 2022" -A x64
          -DARVERB_BUILD_PLUGIN=ON
          -DARVERB_BUILD_TESTS=ON
          -DARVERB_BUILD_SHARED=ON
      - name: Build all tested release targets
        run: cmake --build build-public --config Release --parallel 2 --target ARStudioReverb_VST3 ARStudioReverb_Standalone arverb_plugin_host_tests arverb_tests arverb_contract_tests arverb_audio_regression_tests arverb_stress_tests arverb_c_abi_tests arverb_audio_signature arverb_sonic_structure_tests arverb_algorithm_tests arverb_mix_air_tests arverb_rt60_tail_tests arverb_preset_transition_tests
      - name: Enforce full CTest gate
        run: ctest --test-dir build-public -C Release --output-on-failure
      - name: Bundle redistributables, provenance and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item -Recurse -Path 'build-public/ARStudioReverb_artefacts/Release/VST3/ArSonVerb.vst3' -Destination 'package/ArSonVerb.vst3'
          Copy-Item -Path 'build-public/ARStudioReverb_artefacts/Release/Standalone/ArSonVerb.exe' -Destination 'package/ArSonVerb.exe'
          Copy-Item -Path docs/RELEASE_V1.0.0.md -Destination 'package/RELEASE_NOTES.md'
          Copy-Item -Path LICENSE -Destination 'package/LICENSE'
          Copy-Item -Path assets/fonts/OFL.txt -Destination 'package/INTER-OFL.txt'
          Set-Content -Path 'package/BUILD_PROVENANCE.txt' -Value @(
            'ArSonVerb v1.0.0'
            'Git commit: ${{ github.sha }}'
            'JUCE 9.0.4; Windows x64; VST3 + Standalone'
            'Distribution basis: project AGPL-3.0-only; JUCE 9 AGPLv3'
            'Public binary is unsigned; installer is not included'
          )
          Compress-Archive -Path package/* -DestinationPath 'ArSonVerb-Windows-x64-v1.0.0.zip' -Force
          $hash = (Get-FileHash 'ArSonVerb-Windows-x64-v1.0.0.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ArSonVerb-Windows-x64-v1.0.0.zip" | Set-Content -Path SHA256SUMS.txt -Encoding ascii
      - name: Publish public stable GitHub Release (no prerelease)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Release already exists: refuse to replace immutable public artifacts." >&2
            exit 1
          fi
          gh release create "${{ inputs.version }}" \
            "ArSonVerb-Windows-x64-v1.0.0.zip" "SHA256SUMS.txt" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ArSonVerb v1.0.0 — Stable" \
            --notes-file docs/RELEASE_V1.0.0.md \
            --latest
