name: Core C++ CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'include/**', 'tests/**', 'CMakeLists.txt', '.github/workflows/core-ci.yml']
  pull_request:
    paths: ['src/**', 'include/**', 'tests/**', 'CMakeLists.txt', '.github/workflows/core-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arverb-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-build-and-tests:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PR feedback: Linux + sanitizer. Windows/macOS on main or manual.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","windows-2022","macos-15"]') }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # P2 compares with the synthetic PR merge's first-parent DSP.
          fetch-depth: 2
      - name: Configure CMake
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DARVERB_BUILD_TESTS=ON -DARVERB_BUILD_SHARED=ON
      - name: Compile (Release)
        run: cmake --build build-ci --config Release --parallel 2
      - name: Run CTest
        run: ctest --test-dir build-ci -C Release --output-on-failure
      # One informational offline baseline, only on Linux Release; no new
      # jobs and no flaky time-budget assertions on shared GitHub runners.
      - name: P1 DSP callback profiler (54 scenarios, quick CI sample)
        if: matrix.os == 'ubuntu-24.04'
        run: ./build-ci/arverb_benchmark --quick > build-ci/p1-dsp-callbacks.csv
      - name: P2 same-runner byte-exact audio and CPU A/B
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/p2-')
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^1:src/Reverb.cpp > build-ci/p2-reference-Reverb.cpp
          c++ -std=c++17 -O3 -DNDEBUG -Isrc -Iinclude build-ci/p2-reference-Reverb.cpp src/Presets.cpp tests/audio_signature.cpp -o build-ci/p2-reference-audio
          ./build-ci/p2-reference-audio > build-ci/p2-before-audio.txt
          ./build-ci/arverb_audio_signature > build-ci/p2-after-audio.txt
          diff -u build-ci/p2-before-audio.txt build-ci/p2-after-audio.txt
          c++ -std=c++17 -O3 -DNDEBUG -Isrc -Iinclude build-ci/p2-reference-Reverb.cpp src/Presets.cpp tests/benchmark.cpp -o build-ci/p2-reference-benchmark
          ./build-ci/p2-reference-benchmark --quick > build-ci/p2-before-54.csv
          ./build-ci/arverb_benchmark --quick > build-ci/p2-after-54.csv
          python3 scripts/compare_perf.py build-ci/p2-before-54.csv build-ci/p2-after-54.csv > build-ci/p2-AB.txt
          cat build-ci/p2-AB.txt
      - name: Upload P2 matched-runner A/B evidence
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/p2-')
        uses: actions/upload-artifact@v4
        with:
          name: ArSonVerb-P2-Linux-Matched-AB
          path: |
            build-ci/p2-before-audio.txt
            build-ci/p2-after-audio.txt
            build-ci/p2-before-54.csv
            build-ci/p2-after-54.csv
            build-ci/p2-AB.txt
          if-no-files-found: error
          retention-days: 7
      # Compare the sonic P3 DSP against P2 using the same Release runner.
      # No extra job, no statistically unsound performance pass threshold.
      - name: P3 matched P2-vs-P3 CPU callback profile
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/p3-')
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^1:src/Reverb.cpp > build-ci/p3-P2-Reverb.cpp
          c++ -std=c++17 -O3 -DNDEBUG -Isrc -Iinclude build-ci/p3-P2-Reverb.cpp src/Presets.cpp tests/benchmark.cpp -o build-ci/p3-P2-benchmark
          ./build-ci/p3-P2-benchmark --quick > build-ci/p3-P2-54.csv
          ./build-ci/arverb_benchmark --quick > build-ci/p3-P3-54.csv
          python3 scripts/compare_perf.py build-ci/p3-P2-54.csv build-ci/p3-P3-54.csv > build-ci/p3-AB.txt
          cat build-ci/p3-AB.txt
          ./build-ci/p3-P2-benchmark --quick --dense > build-ci/p3-P2-dense-54.csv
          ./build-ci/arverb_benchmark --quick --dense > build-ci/p3-P3-dense-54.csv
          python3 scripts/compare_perf.py build-ci/p3-P2-dense-54.csv build-ci/p3-P3-dense-54.csv > build-ci/p3-dense-AB.txt
          cat build-ci/p3-dense-AB.txt
      - name: Upload P3 matched-runner CPU evidence
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/p3-')
        uses: actions/upload-artifact@v4
        with:
          name: ArSonVerb-P3-P2-vs-P3-Linux-CPU
          path: |
            build-ci/p3-P2-54.csv
            build-ci/p3-P3-54.csv
            build-ci/p3-AB.txt
            build-ci/p3-P2-dense-54.csv
            build-ci/p3-P3-dense-54.csv
            build-ci/p3-dense-AB.txt
          if-no-files-found: error
          retention-days: 7
      - name: Publish P1 DSP profiler CSV
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: ArSonVerb-P1-Core-Callback-Profile-Linux
          path: build-ci/p1-dsp-callbacks.csv
          if-no-files-found: error
          retention-days: 7

  linux-sanitizers:
    name: Linux / ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure sanitizers
        run: >-
          cmake -S . -B build-sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DARVERB_BUILD_TESTS=ON
          -DARVERB_BUILD_SHARED=OFF
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined\ -fno-omit-frame-pointer
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
      - name: Compile
        run: cmake --build build-sanitizers --parallel 2
      - name: Run sanitizers
        run: ctest --test-dir build-sanitizers --output-on-failure
